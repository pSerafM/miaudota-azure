<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Pet</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>🐾 Adote um Pet</h1>

    <a href="index.html" class="botao">
        Voltar
    </a>

</header>

<main>

    <h2 id="titulo-formulario">
        Cadastrar Pet
    </h2>

    <form id="formulario-pet">

        <label for="nome">
            Nome
        </label>

        <input
            type="text"
            id="nome"
            required
        >


        <label for="especie">
            Espécie
        </label>

        <select id="especie" required>

            <option value="">
                Selecione
            </option>

            <option value="Cachorro">
                Cachorro
            </option>

            <option value="Gato">
                Gato
            </option>

            <option value="Outro">
                Outro
            </option>

        </select>


        <label for="raca">
            Raça
        </label>

        <input
            type="text"
            id="raca"
            required
        >


        <label for="idade">
            Idade
        </label>

        <input
            type="number"
            id="idade"
            min="0"
            required
        >


        <label for="sexo">
            Sexo
        </label>

        <select id="sexo" required>

            <option value="">
                Selecione
            </option>

            <option value="Macho">
                Macho
            </option>

            <option value="Fêmea">
                Fêmea
            </option>

        </select>


        <label for="porte">
            Porte
        </label>

        <select id="porte" required>

            <option value="">
                Selecione
            </option>

            <option value="Pequeno">
                Pequeno
            </option>

            <option value="Médio">
                Médio
            </option>

            <option value="Grande">
                Grande
            </option>

        </select>


        <label for="descricao">
            Descrição
        </label>

        <textarea
            id="descricao"
            rows="5"
            required
        ></textarea>


        <button
            type="submit"
            class="botao"
        >
            Salvar Pet
        </button>

    </form>

</main>

<script src="js/pet-service.js"></script>
<script src="js/cadastro.js"></script>

</body>

</html>
